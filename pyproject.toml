[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "runtimefit"
version = "0.2.0"
description = "Evidence-backed deployment decisions for LLM inference."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "RuntimeFit contributors"}]
keywords = ["llm", "inference", "benchmark", "performance", "deployment", "slo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kraftaa/runtimefit"
Repository = "https://github.com/kraftaa/runtimefit"
Issues = "https://github.com/kraftaa/runtimefit/issues"

[project.optional-dependencies]
yaml = ["PyYAML>=6.0,<7"]
dev = ["mypy>=2.3,<3", "ruff>=0.16,<0.17"]

[project.scripts]
runtimefit = "runtimefit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
